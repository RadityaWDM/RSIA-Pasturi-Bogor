<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSIA Pasutri Bogor – Prototipe Sistem Layanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#102a30;--mut:#5a6f75;--line:#e2e9eb;--pri:#0e8a83;--pri-d:#0a6b66;--pri-s:#e5f4f3;--pink:#e0457b;--pink-d:#c0336a;--pink-s:#fdecf3;--ok:#16794a;--ok-s:#e2f4ea;--warn:#a96a0b;--warn-s:#fdf1d8;--bad:#b42318;--bad-s:#fdebe9;--blue:#1f56a5;--blue-s:#e6eefa;--r:14px;--sh:0 1px 2px rgba(16,42,48,.06),0 6px 20px rgba(16,42,48,.05)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:800}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
@media(max-width:600px){.container{padding:0 16px}h1{font-size:22px}}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* demo strip */
.demo{background:#0d2227;color:#cfe3e1;font-size:12.5px}
.demo .container{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.demo b{color:#fff;font-weight:700}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:#cfe3e1;padding:6px 14px;border-radius:8px;font-weight:600;font-size:12.5px}
.seg button.on{background:#fff;color:var(--pri-d)}
@media(max-width:600px){.demo .container>span{display:none}.seg{width:100%}.seg button{flex:1;padding:7px 4px}}

/* header */
.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.site .container{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16px;line-height:1.15;white-space:nowrap}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),#13a89f);color:#fff;display:grid;place-items:center}
.logo small{display:block;font-weight:500;font-size:11.5px;color:var(--mut)}
.topnav{display:flex;gap:2px;flex:1}
.topnav button{border:0;background:none;padding:9px 13px;border-radius:10px;font-weight:600;color:var(--mut);font-size:14px;white-space:nowrap}
@media(max-width:1100px){.site .container{gap:16px}.topnav button{padding:9px 9px;font-size:13px}.logo small{display:none}}
.topnav button:hover{background:var(--bg);color:var(--ink)}
.topnav button.on{background:var(--pri-s);color:var(--pri-d)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.who b{display:block;color:var(--ink);font-size:13.5px;line-height:1.2}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--pri-s);color:var(--pri-d);flex:none}
@media(max-width:900px){.topnav{display:none}.site .container{height:60px}}

/* buttons / form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;padding:10px 18px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri-d);border-color:var(--line)}
.btn.ghost:hover{background:var(--pri-s);border-color:var(--pri)}
.btn.danger{background:#fff;color:var(--bad);border-color:#f2c4c0}
.btn.danger:hover{background:var(--bad-s)}
.btn.pink{background:var(--pink);border-color:var(--pink)}.btn.pink:hover{background:var(--pink-d);border-color:var(--pink-d)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.lg{padding:13px 24px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
input[type=text],input[type=tel],input[type=date],input:not([type]),select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:.15s;min-height:44px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-s)}
input.bad,select.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;margin-top:5px;font-weight:500}
.hint{color:var(--mut);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.segc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segc button{border:1.5px solid var(--line);background:#fff;padding:11px;border-radius:11px;font-weight:600}
.segc button.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri-d)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mut);cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--pri);flex:none}

/* layout pieces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ch .hint{margin-top:2px}
.page{padding:32px 0 72px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.pagehead p{color:var(--mut);margin-top:6px;max-width:640px}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.grid{gap:14px}.card{padding:18px}.page{padding:22px 0 90px}}
.stack{display:grid;gap:20px;align-content:start}
.split{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:92px;padding-top:32px}
.side .lbl2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px 12px}
.side button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:11px;font-weight:600;color:var(--mut);text-align:left;margin-bottom:2px}
.side button:hover{background:#fff;color:var(--ink)}
.side button.on{background:#fff;color:var(--pri-d);box-shadow:var(--sh)}
.side button.on svg{color:var(--pri)}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:0}.side{display:none}}
.bottom{display:none}
@media(max-width:900px){.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mut);padding:6px 2px;border-radius:10px;min-width:0}
.bottom button.on{color:var(--pri-d)}.bottom button.on svg{color:var(--pri)}}

/* chips, badges */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mut)}
.chip:hover{border-color:var(--pri);color:var(--pri-d)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pri-s);color:var(--pri-d);white-space:nowrap}
.badge.ok{background:var(--ok-s);color:var(--ok)}.badge.warn{background:var(--warn-s);color:var(--warn)}.badge.bad{background:var(--bad-s);color:var(--bad)}.badge.blue{background:var(--blue-s);color:var(--blue)}.badge.gray{background:var(--bg);color:var(--mut)}.badge.pink{background:var(--pink-s);color:var(--pink-d)}
.qno{display:inline-block;min-width:54px;text-align:center;padding:4px 8px;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em}

/* hero */
.hero{background:linear-gradient(120deg,#0b6e69 0%,#0e8a83 55%,#17a79d 100%);border-radius:22px;color:#fff;padding:40px;display:grid;grid-template-columns:1.25fr 1fr;gap:32px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h1{font-size:34px;color:#fff;margin-bottom:12px}
.hero p{opacity:.9;max-width:480px}
.search{display:flex;background:#fff;border-radius:14px;padding:6px;margin-top:22px;max-width:520px;position:relative;z-index:1}
.search input{border:0;box-shadow:none!important;min-height:44px;flex:1;color:var(--ink)}
.hero .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.24)}
.status{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:22px;position:relative;z-index:1;align-self:center}
.status h3{color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.status .row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,.18);font-size:14px}
.status .row b{font-size:18px}
.dot{width:8px;height:8px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 4px rgba(125,255,181,.25)}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:26px;border-radius:18px}.hero h1{font-size:26px}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--sh);transition:.15s}
.tile:hover{border-color:var(--pri);transform:translateY(-2px)}
.tile .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--pri-s);color:var(--pri-d);flex:none}
.tile b{display:block;font-size:14px;line-height:1.25}.tile small{color:var(--mut);font-size:12px}
.sec{margin-top:36px}
.sec>.ch{margin-bottom:16px}
.link{border:0;background:none;color:var(--pri-d);font-weight:700;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;padding:0}

/* poli tiles */
.polis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.poli{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px 12px;text-align:center;transition:.15s;display:block;width:100%}
.poli:hover{border-color:var(--pri);box-shadow:var(--sh)}
.poli.on{border-color:var(--pri);background:var(--pri-s)}
.poli .pc{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:26px}
.poli b{display:block;font-size:13.5px;line-height:1.3}.poli small{color:var(--mut);font-size:12px}

/* doctor rows */
.dcard{display:flex;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%;text-align:left;transition:.15s}
button.dcard:hover{border-color:var(--pri)}
.dcard.on{border-color:var(--pri);background:var(--pri-s)}
.dcard .av{width:48px;height:48px;font-size:15px}
.dcard .t{flex:1;min-width:0}.dcard b{display:block;line-height:1.3}.dcard small{color:var(--mut);font-size:12.5px}
.days{display:flex;gap:4px;margin-top:8px}
.days span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--bg);color:#a3b2b6}
.days span.y{background:var(--pri);color:#fff}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.dgrid .card{padding:18px}
.dgrid .top{display:flex;gap:14px;align-items:center;margin-bottom:12px}

/* stepper */
.stepper{display:flex;margin-bottom:24px}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;font-size:12.5px;font-weight:600;color:var(--mut);text-align:center}
.stepper .st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.stepper .st:first-child::before{display:none}
.stepper .st.done::before,.stepper .st.on::before{background:var(--pri)}
.stepper .c{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;z-index:1;font-weight:700;font-size:13px}
.stepper .st.on .c{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 5px var(--pri-s)}
.stepper .st.done .c{background:var(--pri);border-color:var(--pri);color:#fff}
.stepper .st.on,.stepper .st.done{color:var(--ink)}
@media(max-width:600px){.stepper .st span{display:none}.stepper .st.on span{display:block;position:absolute;top:40px;white-space:nowrap}.stepper{margin-bottom:40px}}
.book{display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:start}
@media(max-width:1000px){.book{grid-template-columns:1fr}}
.sum{position:sticky;top:92px}
.sum .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sum .row:last-of-type{border:0}
.sum .row span{color:var(--mut)}.sum .row b{text-align:right;font-weight:600}
.sum .empty{color:#a3b2b6;font-weight:500}
.note{display:flex;gap:10px;background:var(--blue-s);color:var(--blue);border-radius:11px;padding:12px 14px;font-size:13px;margin-top:14px}
.note.warn{background:var(--warn-s);color:var(--warn)}
.dates{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.dchip{flex:none;width:74px;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:10px 0;text-align:center}
.dchip small{display:block;color:var(--mut);font-size:12px;font-weight:600}.dchip b{display:block;font-size:22px;line-height:1.2}
.dchip:hover{border-color:var(--pri)}.dchip.on{background:var(--pri);border-color:var(--pri);color:#fff}.dchip.on small{color:#d5f2ef}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 4px;text-align:center;font-weight:700}
.slot small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.slot:hover:not([disabled]){border-color:var(--pri)}
.slot.on{background:var(--pri);border-color:var(--pri);color:#fff}.slot.on small{color:#d5f2ef}
.slot.full{background:var(--bg);color:#a3b2b6;cursor:not-allowed;text-decoration:line-through}
.formsec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pri-d);margin:6px 0 14px;display:flex;align-items:center;gap:10px}
.formsec::after{content:"";flex:1;height:1px;background:var(--line)}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}

/* success */
.okcard{max-width:620px;margin:0 auto;text-align:center}
.okic{width:68px;height:68px;border-radius:50%;background:var(--ok-s);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px}
.okic svg{width:34px;height:34px;stroke-width:2.5}
.kode{display:inline-block;font-size:30px;font-weight:800;letter-spacing:.08em;background:var(--bg);border:2px dashed var(--line);padding:6px 20px;border-radius:12px;margin:10px 0}
.info3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;text-align:left}
.info3>div{background:var(--bg);border-radius:12px;padding:12px 14px}.info3 small{color:var(--mut);display:block;font-size:12px}.info3 b{font-size:15px}
@media(max-width:600px){.info3{grid-template-columns:1fr}}
.wa{background:#dcf8c6;color:#0b1a0b;border-radius:14px 14px 14px 3px;padding:12px 14px;font-size:13.5px;white-space:pre-line;text-align:left;border:1px solid #c4e6a9;max-width:380px}
.phone{background:#e9e1d6;border-radius:18px;padding:14px;max-width:420px;margin:0 auto;text-align:left}
.phone .hd{font-size:12px;color:#5a5a4f;margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:600}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:12px 16px;background:#f8fafb;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#fafcfc}
.tbl small{color:var(--mut);display:block;font-size:12.5px}
.scroll{overflow-x:auto}

/* kpi */
.kpi{display:flex;gap:14px;align-items:flex-start}
.kpi .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi b{font-size:28px;line-height:1.1;font-weight:800;display:block}
.kpi span{color:var(--mut);font-size:13px;display:block}
.kpi em{font-style:normal;font-size:12px;font-weight:700;display:block;margin-top:4px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.ib.t1{background:var(--pri-s);color:var(--pri-d)}.ib.t2{background:var(--pink-s);color:var(--pink-d)}.ib.t3{background:var(--warn-s);color:var(--warn)}.ib.t4{background:var(--blue-s);color:var(--blue)}
.bars .row{display:grid;grid-template-columns:130px 1fr 40px;gap:12px;align-items:center;margin:10px 0;font-size:13px}
.bars .t{background:var(--bg);border-radius:8px;height:12px;overflow:hidden}.bars .f{height:100%;background:linear-gradient(90deg,var(--pri),#2bb5ab);border-radius:8px}
.bars .row b{text-align:right}
.cols{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:8px}
.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut);gap:4px}
.cols i{display:block;width:100%;max-width:44px;background:linear-gradient(180deg,#2bb5ab,var(--pri));border-radius:7px 7px 0 0;min-height:3px}

/* now card */
.now{background:linear-gradient(140deg,#0b6e69,#0e8a83);color:#fff;border-radius:var(--r);padding:24px;text-align:center;box-shadow:var(--sh)}
.now small{opacity:.85;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.now b{display:block;font-size:64px;line-height:1.05;font-weight:800;margin:6px 0 4px}
.now .who2{opacity:.92;font-size:14px;min-height:42px}

/* TV board */
.tv{background:#07191d;color:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.tvhead{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;background:#0b2a30;border-bottom:1px solid #16414a;gap:16px;flex-wrap:wrap}
.tvhead b{font-size:20px}.tvhead span{color:#9cc6c2}
.tvhead .clk{font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}

  if(f.penjamin=='BPJS'){if(!/^\d{13}$/.test(f.noBpjs||''))e.noBpjs='No. kartu BPJS 13 digit.';if(!f.rujukan)e.rujukan='Nomor rujukan FKTP wajib untuk poli spesialis.'}

function waText(b){const d=dok(b.dokterId);return `RSIA Pasutri Bogor\nHalo ${b.nama.split(' ')[0]}, booking Anda terkonfirmasi ✅\n\nKode: ${b.id}\nNo. antrean: ${b.queue}\nPoli: ${poli(b.poli).nama}\nDokter: ${d.nama}\nJadwal: ${fmtD(b.date)}, ${b.time}\nPenjamin: ${b.penjamin}\nEstimasi dilayani: ±${estMin(b)} menit dari jam booking\n\nDatang 15 menit sebelumnya & bawa KTP${b.penjamin=='BPJS'?', kartu BPJS & rujukan':''}.\nUbah/batalkan: balas UBAH atau BATAL.`}
function todayQ(){return DB.bookings.filter(b=>b.date==iso(TODAY)&&b.status!='Batal').sort((a,b)=>a.time.localeCompare(b.time))}
function logA(aksi,detail){DB.audit.unshift({t:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),who:'Staf Pendaftaran',aksi,detail})}

const busyFor=id=>dokQueue(id).find(b=>['Dipanggil','Dilayani'].includes(b.status));
function callDok(id){const busy=busyFor(id);if(busy)return toast('Masih ada pasien '+busy.queue+' ('+busy.status+'). Selesaikan atau lewati dulu.');
  const n=nextFor(id);if(!n)return toast('Belum ada pasien yang check-in untuk dokter ini.');setStatus(n.id,'Dipanggil')}
function callRow(id){const b=DB.bookings.find(x=>x.id==id);const busy=busyFor(b.dokterId);if(busy)return toast('Dokter ini masih melayani '+busy.queue+'. Selesaikan atau lewati dulu.');

  setStatus(id,'Dipanggil')}
function skipPatient(id){const b=DB.bookings.find(x=>x.id==id);b.skips=(b.skips||0)+1;
  if(b.skips>=2){logA('Dilewati 2x, dianggap tidak hadir',b.queue+' · '+b.nama);return setStatus(id,'Tidak hadir')}
  b.status='Dilewati';sendWA(b.nama,`Nomor ${b.queue} dilewati karena tidak ada di ruang tunggu. Segera lapor ke loket agar dipanggil ulang (sisa ${2-b.skips} kesempatan).`,'Dilewati');

function setTelat(id,min){const d=dok(id);d.telat=min;const aff=dokQueue(id).filter(b=>['Terjadwal','Hadir','Dilewati'].includes(b.status));

    DB.delays=DB.delays.filter(x=>!(x.date==iso(TODAY)&&x.dokterId==id));DB.delays.push({date:iso(TODAY),dokterId:id,min});

  else{aff.forEach(b=>sendWA(b.nama,`${d.nama} sudah hadir, praktik dimulai.`,'Dokter hadir'));DB.delays=DB.delays.filter(x=>!(x.date==iso(TODAY)&&x.dokterId==id));logA('Dokter hadir',d.nama);toast('Status terlambat dihapus.')}

function cek(){const ex=DB.bookings.filter(b=>b.status=='Terjadwal'&&b.date>=iso(TODAY)).slice(0,3).map(b=>b.id);
  let h=`${head('Cek / Ubah Booking','Lihat status, ubah jadwal, atau batalkan booking dengan kode booking.')}<div style="max-width:760px"><div class="card"><div class="fgrid"><div class="field" style="margin:0"><label for="ck">Kode booking</label><input id="ck" placeholder="PST-XXXX00" value="${esc(S.cekId)}"></div><div class="field" style="margin:0"><label for="cn">NIK (opsional di demo)</label><input id="cn" placeholder="16 digit"></div></div><div class="actions" style="border:0;margin-top:14px;padding:0"><span class="hint">Contoh kode: ${ex.map(x=>`<a href="#" data-act="gocek" data-v="${x}" style="color:var(--pri-d);font-weight:700">${x}</a>`).join(' · ')}</span><button class="btn" data-act="cari">${ic('search',16)} Cari booking</button></div></div>`;

/* ---- MANAJEMEN ---- */
function dash(){const R=S.mgmtRange,from=iso(addD(TODAY,-R+1));
  const L=DB.bookings.filter(b=>b.date>=from&&b.date<=iso(TODAY)&&b.status!='Batal');
  const done=L.filter(b=>b.status=='Selesai'),ns=L.filter(b=>b.status=='Tidak hadir');
  const fin=done.length+ns.length;const nsr=fin?Math.round(ns.length/fin*100):0;
  const wl=done.filter(b=>b.wait);const wait=wl.length?Math.round(wl.reduce((s,b)=>s+b.wait,0)/wl.length):0;
  const open=DB.tickets.filter(t=>t.status!='Selesai').length,late=DB.tickets.filter(t=>t.status!='Selesai'&&t.umur>=2).length;
  const by=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=e=>{const mx=Math.max(...e.map(x=>x[1]),1);return `<div class="bars">${e.map(([k,v])=>`<div class="row"><span>${k}</span><div class="t"><div class="f" style="width:${v/mx*100}%"></div></div><b>${v}</b></div>`).join('')}</div>`};
  const days=[];for(let i=R-1;i>=0;i--){const d=iso(addD(TODAY,-i));days.push([d,DB.bookings.filter(b=>b.date==d&&b.status!='Batal').length])}
  const mx=Math.max(...days.map(x=>x[1]),1);
  const ch=by(L,b=>b.channel);const web=(ch.find(c=>c[0]=='Web')||[0,0])[1];
  const wp=Object.entries(wl.reduce((m,b)=>{const k=poli(b.poli).nama;(m[k]=m[k]||[]).push(b.wait);return m},{})).map(([k,a])=>[k,Math.round(a.reduce((x,y)=>x+y,0)/a.length)]).sort((a,b)=>b[1]-a[1]);
  const kp=(i,t,v,l,d,c)=>`<div class="card kpi"><span class="ib ${t}">${ic(i,22)}</span><div><b>${v}</b><span>${l}</span><em class="${c}">${d}</em></div></div>`;
  const card=(t,s,b)=>`<div class="card"><div class="ch"><div><h2>${t}</h2>${s?`<div class="hint">${s}</div>`:''}</div></div>${b}</div>`;
  return `${head('Dashboard Manajemen',`Ringkasan layanan ${R} hari terakhir (data contoh)`,`<div class="chips">${[7,14].map(r=>`<button class="chip ${R==r?'on':''}" data-act="range" data-v="${r}">${r} hari</button>`).join('')}</div>`)}
  <div class="grid g4">${kp('users','t1',L.length,'Kunjungan terjadwal','dari semua kanal','hint')}${kp('alert','t2',nsr+'%','Tingkat tidak hadir',nsr>10?'di atas target 10%':'sesuai target',nsr>10?'dn':'up')}${kp('clock','t3',wait+' mnt','Rata-rata waktu tunggu',wait>30?'di atas target 30 mnt':'sesuai target',wait>30?'dn':'up')}${kp('msg','t4',open,'Keluhan terbuka',late+' lewat SLA 24 jam',late?'dn':'up')}</div>
  <div class="grid g2" style="margin-top:20px">
   ${card('Tren booking harian','Jumlah booking per hari',`<div class="cols">${days.map(([d,n])=>`<div><span>${n}</span><i style="height:${n/mx*100}%"></i><span>${d.slice(8)}</span></div>`).join('')}</div>`)}
   ${card('Waktu tunggu per poli','Rata-rata menit sampai dilayani',bars(wp)+`<p class="hint" style="margin-top:8px">Ulasan Google menyebut antre Obgyn ±2 jam; data contoh ini menirunya.</p>`)}
   ${card('Kunjungan per poli','',bars(by(L,b=>poli(b.poli).nama)))}
   ${card('Kanal pendaftaran','',bars(ch)+`<p class="hint" style="margin-top:8px">Booking online ${L.length?Math.round(web/L.length*100):0}% dari total. Target: kurangi beban loket dan telepon.</p>`)}
   ${card('Penjamin','',bars(by(L,b=>b.penjamin)))}
   ${card('Keluhan per kategori','',bars(by(DB.tickets,t=>t.kat)))}
   ${card('Keterlambatan dokter','Penyebab antrean lama yang sebelumnya tidak tercatat',telatCard())}
  </div>`}
function masalah(){const P=[
 ['Ulasan Google (473 ulasan, rating 4,1): sistem nomor pendaftaran error sehingga pendaftaran ditulis manual.','Nomor antrean dibuat sistem berurutan per poli per hari (tidak bisa dobel). Staf punya form walk-in sebagai cadangan, tetap dalam urutan yang sama.'],
 ['Ulasan Google: antrean dobel (luar dan dalam) dan antre dokter kandungan hingga ±2 jam.','Satu urutan antrean untuk online + walk-in, Layar Antrean per poli, estimasi waktu tunggu di konfirmasi, dan dashboard waktu tunggu per poli.'],
 ['Nomor terlewat: pasien dipanggil tapi tidak ada, lalu tidak jelas nasib nomornya. Tidak ada jejak siapa memanggil siapa.','Status Dilewati: pasien diberi tahu lewat WhatsApp dan boleh dipanggil ulang 1 kali, lalu dianggap tidak hadir. Panggilan di luar urutan wajib beralasan dan masuk Jejak Aktivitas.'],
 ['Dokter datang terlambat, pasien menunggu di ruang tunggu tanpa kabar sehingga antrean terasa sangat lama.','Staf menandai keterlambatan 15/30/60 menit: semua pasien dokter itu diberi tahu lewat WhatsApp, estimasi bergeser, dan tampil di Layar Antrean.'],
 ['Tombol "Booking Poliklinik" dan WhatsApp mengambang menjadi dua jalur terpisah. Pasien darurat dan pasien biasa tercampur.','Satu pintu masuk: booking terstruktur untuk jadwal, tombol Darurat terpisah. Data dari WhatsApp tetap masuk ke daftar booking yang sama.'],
 ['Halaman Dokter hanya memuat foto, nama, dan spesialisasi. Jadwal praktik tidak ada.','Jadwal Dokter menampilkan hari, jam, dan tombol booking per dokter. Staf mengubah jadwal di satu tempat.'],
 ['Form booking: hanya NIK yang wajib. Tidak ada validasi 16 digit, nomor HP, atau cegah duplikat.','Validasi per field, NIK 16 digit, WhatsApp, tanggal lahir, dan satu booking aktif per pasien-dokter-hari.'],
 ['BPJS/Asuransi hanya berupa pilihan. Tidak ada no. kartu, nama asuransi, atau rujukan.','Field penjamin muncul sesuai pilihan: no. BPJS + rujukan, atau nama asuransi + no. polis.'],
 ['Ada kolom "Nomor Antrian" tetapi tidak jelas kapan terisi. Tidak ada pesan sukses, estimasi, atau notifikasi.','Kode booking + nomor antrean + posisi antrean tampil seketika dan dikirim ke WhatsApp.'],
 ['Tidak ada cara mengubah atau membatalkan booking. Hari "tidak tersedia" hanya muncul sebagai pesan error.','Cek Booking: ubah jadwal atau batalkan mandiri. Hari/jam yang tidak tersedia tidak bisa dipilih sama sekali.'],
 ['Halaman Komentar memaksa login (dialihkan ke login.php), tanpa tiket, status, atau balasan. Tidak ada form kontak di halaman Kontak.','Keluhan berbentuk tiket: kategori, SLA 24 jam, balasan, status, dan bisa dilacak pasien.'],
 ['Data tidak rapi: judul "RISA Pasutri", gelar "Sp.A"/"Sp. A.", terapi wicara tanpa nama, nomor kontak tersebar.','Master data dokter terpusat dengan format gelar baku dan nomor kontak resmi satu sumber.'],
 ['Konten placeholder: modal "Judul Layanan", seksi Spesialis kosong, statistik pengunjung tetap 1.234/5.678.','Dashboard memakai data nyata dari transaksi, bukan angka statis.'],
 ['Manajemen tidak punya gambaran no-show, waktu tunggu, atau keluhan karena semua data tersebar.','Dashboard KPI: no-show, waktu tunggu, kanal, penjamin, SLA keluhan.']];
 return `${head('Masalah → Solusi','Temuan di website rsiapasutri.co.id (dibaca 22 Okt 2026) dan ulasan pasien di Google Maps, dipetakan ke fitur prototipe.','<span class="tag">Sumber: website RS &amp; ulasan Google Maps</span>')}${P.map(([a,b])=>`<div class="prob"><div class="a"><small>Masalah</small>${a}</div><div class="mid">${ic('arr',20)}</div><div class="b"><small>Di prototipe</small>${b}</div></div>`).join('')}`}

/* ============ EVENTS ============ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||el.disabled||el.type=='checkbox')return;
  const a=el.dataset.act,v=el.dataset.v,B=S.book;
  if(el.tagName=='A')ev.preventDefault();
  if(a=='role')return setRole(v);
  if(a=='tab')return setTab(v);
  if(a=='emg'){sendWA('IGD','Halo RSIA Pasutri, saya membutuhkan bantuan darurat!','Darurat');return toast('Demo: membuka WhatsApp IGD 0811-9418-500 dengan pesan terisi.')}
  if(a=='dosearch'){S.q=document.getElementById('hs').value;S.filterPoli='all';return setTab('dokter')}
  if(a=='bpoli0'){S.book={step:2,poli:v,f:S.book.f};return setTab('booking')}
  if(a=='pickdok'){const d=dok(v);S.book={step:3,poli:d.poli,dok:d.id,f:S.book.f};return setTab('booking')}
  if(a=='bpoli'){B.poli=v;B.dok=B.date=B.time=null;B.step=2}
  if(a=='bdok'){B.dok=+v;B.date=B.time=null;B.step=3}
  if(a=='bdate'){B.date=v;B.time=null}
  if(a=='btime')B.time=v;
  if(a=='next')B.step=4;
  if(a=='prev'){if(B.step==4)collect();B.step=Math.max(1,B.step-1)}
  if(a=='penj'){collect();B.f.penjamin=v;B.err=null}
  if(a=='tovalid'){collect();B.err=validate(B.f);if(!Object.keys(B.err).length)B.step=5;else toast('Periksa isian yang bertanda merah.')}
  if(a=='confirm'){const f=B.f;const dup=DB.bookings.find(b=>b.nik==f.nik&&b.dokterId==B.dok&&b.date==B.date&&b.status=='Terjadwal');
    if(dup){toast('NIK ini sudah punya booking aktif dengan dokter & hari yang sama ('+dup.id+').');return}
    if(CAP-used(B.dok,B.date,B.time)<=0){toast('Maaf, slot baru saja terisi. Pilih jam lain.');B.step=3;return render()}
    const b=mkBooking({nama:f.nama,nik:f.nik,wa:f.wa,date:B.date,time:B.time,dokterId:B.dok,poli:B.poli,penjamin:f.penjamin,channel:'Web',queue:nextQ(B.poli,B.date)});
    DB.bookings.push(b);sendWA(b.nama+' ('+b.wa+')',waText(b),'Konfirmasi');B.done=b;B.step=6}
  if(a=='newbook')S.book={step:1};
  if(a=='gocek'){S.cekId=v;S.cekErr=null;S.cekRes=DB.bookings.find(b=>b.id==v)||null;if(!S.cekRes)S.cekErr='Kode tidak ditemukan.';return setTab('cek')}
  if(a=='cari'){const id=document.getElementById('ck').value.trim().toUpperCase();S.cekId=id;S.cekRes=DB.bookings.find(b=>b.id==id)||null;S.cekErr=S.cekRes?null:'Kode booking tidak ditemukan. Periksa kembali kode pada pesan WhatsApp Anda.'}
  if(a=='cancel'){const b=DB.bookings.find(x=>x.id==v);b.status='Batal';sendWA(b.nama,`Booking ${b.id} dibatalkan sesuai permintaan. Slot dibuka kembali.`,'Pembatalan');toast('Booking dibatalkan.')}
  if(a=='resched'){const b=S.cekRes;b.status='Batal';S.book={step:3,poli:b.poli,dok:b.dokterId};S.cekRes=null;toast('Pilih jadwal baru. Booking lama dibatalkan.');return setTab('booking')}
  if(a=='fpoli')S.filterPoli=v;
  if(a=='jpoli')S.jadPoli=v;
  if(a=='stpoli')S.stPoli=v;
  if(a=='kirimk'){const m=document.getElementById('km').value.trim();if(m.length<10){S.keluh={err:{m:'Mohon tuliskan minimal 10 karakter.'}};return render()}
    const t={id:'KLH-'+String(DB.tickets.length+1).padStart(3,'0'),kat:document.getElementById('kk').value,pesan:m,nama:document.getElementById('kn').value||'Anonim',kontak:document.getElementById('kc').value,status:'Baru',umur:0,balasan:[]};DB.tickets.push(t);S.keluh={ok:t.id}}
  if(a=='lacak'){const q=document.getElementById('kt').value.trim().toUpperCase();S.keluh={q,hit:DB.tickets.find(t=>t.id==q)}}
  if(a=='calldok')return callDok(+v);
  if(a=='callrow')return callRow(el.dataset.id);
  if(a=='skip')return skipPatient(el.dataset.id);
  if(a=='telat')return setTelat(+el.dataset.id,+v);
  if(a=='walkin'){const n=document.getElementById('wn').value.trim();if(n.length<3)return toast('Isi nama pasien.');const dk=dok(document.getElementById('wd').value);const t=slotsOf(dk).filter(x=>x>=nowHM())[0]||slotsOf(dk).slice(-1)[0];const b=mkBooking({nama:n,date:iso(TODAY),time:t,dokterId:dk.id,poli:dk.poli,channel:'Walk-in',status:'Hadir',penjamin:'Umum',queue:nextQ(dk.poli,iso(TODAY))});DB.bookings.push(b);logA('Walk-in',n+' → '+b.queue);toast('Walk-in '+n+' → nomor '+b.queue)}
  if(a=='setst')return setStatus(el.dataset.id,v);
  if(a=='tkt'){const t=DB.tickets.find(x=>x.id==el.dataset.id);t.status=v;if(v=='Selesai'&&!t.balasan.length)t.balasan.push('Terima kasih atas masukannya. Kasus ditutup oleh tim layanan pelanggan.');toast('Tiket '+t.id+' → '+v)}
  if(a=='reply'){const t=DB.tickets.find(x=>x.id==el.dataset.id);const r=prompt('Balasan untuk '+t.id+':');if(r){t.balasan.push(r);if(t.status=='Baru')t.status='Diproses';sendWA(t.nama+' ('+t.kontak+')',r,'Balasan keluhan')}}
  if(a=='range')S.mgmtRange=+v;
  render()});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset.act=='togday'){const d=dok(el.dataset.id),x=+el.dataset.v;d.hari=el.checked?[...new Set([...d.hari,x])]:d.hari.filter(h=>h!=x);toast('Jadwal diperbarui. Form booking mengikuti.')}});
document.addEventListener('input',ev=>{if(ev.target.id=='dq'){S.q=ev.target.value;document.getElementById('dlist').innerHTML=dokterList()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='hs')document.querySelector('[data-act=dosearch]').click()});
function collect(){const B=S.book;B.f=B.f||{};document.querySelectorAll('[data-f]').forEach(i=>B.f[i.dataset.f]=i.type=='checkbox'?i.checked:i.value)}
render();
</script>
